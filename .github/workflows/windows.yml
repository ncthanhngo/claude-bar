name: Windows

on:
  pull_request:
    branches: [main]
    paths: ['backend/**', 'windows/**', '.github/workflows/windows.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'windows/**', '.github/workflows/windows.yml']
    tags: ['win-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Backend tests (Windows adapters, locks, swap engine)
        working-directory: backend
        run: go test ./...
      - name: Tray tests
        working-directory: windows
        run: go test ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/win-v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Check tag matches windows/VERSION
        run: |
          tag="${GITHUB_REF_NAME#win-v}"
          [ "$tag" = "$(cat windows/VERSION)" ] || { echo "tag $tag != windows/VERSION $(cat windows/VERSION)"; exit 1; }
      - name: Install build tools
        run: |
          command -v make || choco install make --no-progress -y
          choco upgrade innosetup --no-progress -y  # needs 6.3+ for x64compatible
      - name: Build exes
        working-directory: windows
        run: make build
      - name: Zip and build installers
        working-directory: windows
        run: |
          v=$(cat VERSION)
          (cd dist/windows-amd64 && 7z a -tzip ../ClaudeSwap-$v-windows-amd64.zip ClaudeSwap.exe csw.exe)
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DAppVersion=$v installer/claudeswap.iss
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Titled "Windows · …" and never Latest, so the Releases page keeps
        # Windows and macOS apart and releases/latest stays the macOS app.
        # Edit the notes afterwards to add what's new.
        run: |
          v="${GITHUB_REF_NAME#win-v}"
          cat > notes.md <<EOF
          > 🪟 **This is the Windows app (Claude Swap).** On a Mac? Get **Claude Bar for macOS** from the [latest macOS release](https://github.com/ncthanhngo/claude-bar/releases/latest) or \`brew install --cask ncthanhngo/tap/claude-bar\`.

          ## Download

          | File | Use it when |
          |---|---|
          | **\`ClaudeSwap-$v-windows-amd64-setup.exe\`** | Recommended — installs for your Windows user (no admin) |
          | \`ClaudeSwap-$v-windows-amd64.zip\` | Portable — unzip and run \`ClaudeSwap.exe\` (keep \`csw.exe\` next to it) |

          Requires **Windows 10/11, x64 (Intel/AMD)**. Unsigned: SmartScreen may show *More info → Run anyway*; Smart App Control blocks it.
          See [windows/README.md](https://github.com/ncthanhngo/claude-bar/blob/main/windows/README.md) for features.
          EOF
          gh release create "$GITHUB_REF_NAME" windows/dist/*.zip windows/dist/*-setup.exe \
            --title "Windows · Claude Swap $v" \
            --notes-file notes.md \
            --latest=false
